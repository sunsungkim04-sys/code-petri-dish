<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="522" viewBox="0 0 1020 522" font-family="Helvetica, Arial, sans-serif">
<style>
  .lbl{font-size:17px;font-weight:700;fill:#111}
  .h{font-size:12.5px;font-weight:700;fill:#111}
  .t{font-size:11px;fill:#333}
  .ti{font-size:10px;fill:#666;font-style:italic}
  .cell{fill:#fff;stroke:#c8c8c8;stroke-width:1}
  .reach{fill:#fdf3e3;stroke:#e0b870;stroke-width:1}
  .org{fill:#e8f5ec;stroke:#27ae60;stroke-width:1.6}
  .mat{font-size:11px;fill:#8a7a52;font-weight:700}
  .op{font-size:13px;font-weight:700;fill:#111}
  .box{fill:#fff;stroke:#555;stroke-width:1.2}
  .die{fill:#f3e6ef;stroke:#8e44ad;stroke-width:1.4}
  .seek{fill:#fdf3e3;stroke:#c8912f;stroke-width:1.4}
  .ar{stroke:#333;stroke-width:1.3;fill:none}
  .arr{stroke:#c0392b;stroke-width:1.7;fill:none}
  .arg{stroke:#8e44ad;stroke-width:1.7;fill:none;stroke-dasharray:4 3}
  .sep{stroke:#e2e2e2;stroke-width:1}
</style>
<rect fill="#ffffff" width="1020" height="546"/>
<defs>
  <marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker>
  <marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c0392b"/></marker>
  <marker id="ap" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#8e44ad"/></marker>
</defs>

<!-- ============ (a) ============ -->
<text class="lbl" x="24" y="32">a</text>
<text class="h" x="46" y="32">The dish and a copy attempt</text>

<g transform="translate(44,50)">
  <rect class="cell"  x="0"  y="0"  width="46" height="46"/>
  <rect class="reach" x="46" y="0"  width="46" height="46"/>
  <rect class="cell"  x="92" y="0"  width="46" height="46"/>
  <rect class="reach" x="0"  y="46" width="46" height="46"/>
  <rect class="org"   x="46" y="46" width="46" height="46"/>
  <rect class="reach" x="92" y="46" width="46" height="46"/>
  <rect class="cell"  x="0"  y="92" width="46" height="46"/>
  <rect class="reach" x="46" y="92" width="46" height="46"/>
  <rect class="cell"  x="92" y="92" width="46" height="46"/>
  <text class="op" x="69" y="75" text-anchor="middle" fill="#27ae60">racld</text>
  <text class="mat" x="23"  y="28"  text-anchor="middle">n</text>
  <text class="mat" x="69"  y="28"  text-anchor="middle">d</text>
  <text class="mat" x="115" y="28"  text-anchor="middle">e</text>
  <text class="mat" x="23"  y="74"  text-anchor="middle">h</text>
  <text class="mat" x="115" y="74"  text-anchor="middle">j</text>
  <text class="mat" x="23"  y="120" text-anchor="middle">a</text>
  <text class="mat" x="115" y="120" text-anchor="middle" fill="#c0392b">c</text>
  
  
</g>

<g transform="translate(214,56)">
  <path class="ar" d="M0,46 L30,46" marker-end="url(#a)"/>
  <rect class="box" x="38" y="8" width="178" height="32" rx="3"/>
  <text class="t" x="50" y="29">needs <tspan class="op" fill="#1e7a3c">d</tspan> — free nearby</text>
  <text class="t" x="226" y="29" fill="#1e7a3c">&#8594; written</text>
  <rect class="box" x="38" y="62" width="178" height="32" rx="3" stroke="#c0392b"/>
  <text class="t" x="50" y="83">needs <tspan class="op" fill="#c0392b">c</tspan> — none nearby</text>
  <text class="t" x="226" y="83" fill="#c0392b">&#8594; stall</text>
  
</g>

<line class="sep" x1="566" y1="24" x2="566" y2="236"/>

<!-- ============ (b) ============ -->
<text class="lbl" x="592" y="32">b</text>
<text class="h" x="614" y="32">The copying loop</text>

<g transform="translate(604,54)">
  <g transform="translate(0,0)">
    <rect x="0"   y="0" width="30" height="26" class="cell"/><text class="op" x="15"  y="18" text-anchor="middle">r</text>
    <rect x="30"  y="0" width="30" height="26" class="cell"/><text class="op" x="45"  y="18" text-anchor="middle">a</text>
    <rect x="60"  y="0" width="30" height="26" class="cell" fill="#eef4fb"/><text class="op" x="75" y="18" text-anchor="middle">s</text>
    <rect x="90"  y="0" width="30" height="26" class="cell"/><text class="op" x="105" y="18" text-anchor="middle">c</text>
    <rect x="120" y="0" width="30" height="26" class="cell"/><text class="op" x="135" y="18" text-anchor="middle">l</text>
    <rect x="150" y="0" width="30" height="26" class="cell"/><text class="op" x="165" y="18" text-anchor="middle">d</text>
    <path class="ar" d="M135,29 C135,48 105,48 105,31" marker-end="url(#a)" stroke-width="1.7"/>
    <text class="t"  x="198" y="14" fill="#c0392b" font-weight="700">loop 2 ticks per attempt</text>
    <text class="ti" x="198" y="28"><tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" font-style="normal">rascld</tspan> — founder</text>
  </g>
  <g transform="translate(0,66)">
    <rect x="0"   y="0" width="30" height="26" class="cell"/><text class="op" x="15"  y="18" text-anchor="middle">r</text>
    <rect x="30"  y="0" width="30" height="26" class="cell" fill="#eef4fb"/><text class="op" x="45" y="18" text-anchor="middle">s</text>
    <rect x="60"  y="0" width="30" height="26" class="cell"/><text class="op" x="75"  y="18" text-anchor="middle">a</text>
    <rect x="90"  y="0" width="30" height="26" class="cell"/><text class="op" x="105" y="18" text-anchor="middle">c</text>
    <rect x="120" y="0" width="30" height="26" class="cell"/><text class="op" x="135" y="18" text-anchor="middle">l</text>
    <rect x="150" y="0" width="30" height="26" class="cell"/><text class="op" x="165" y="18" text-anchor="middle">d</text>
    <path class="ar" d="M135,29 C135,52 75,52 75,31" marker-end="url(#a)" stroke="#2980b9" stroke-width="1.7"/>
    <text class="t"  x="198" y="14" fill="#2980b9" font-weight="700">loop 3 ticks per attempt</text>
    <text class="ti" x="198" y="28"><tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" font-style="normal">rsacld</tspan></text>
  </g>
  <g transform="translate(0,140)">
    <rect x="0"  y="0" width="30" height="26" class="cell"/><text class="op" x="15"  y="18" text-anchor="middle">r</text>
    <rect x="30" y="0" width="30" height="26" class="cell"/><text class="op" x="45"  y="18" text-anchor="middle">a</text>
    <rect x="60" y="0" width="30" height="26" class="cell"/><text class="op" x="75"  y="18" text-anchor="middle">c</text>
    <rect x="90" y="0" width="30" height="26" class="cell"/><text class="op" x="105" y="18" text-anchor="middle">l</text>
    <rect x="120" y="0" width="30" height="26" class="cell"/><text class="op" x="135" y="18" text-anchor="middle">d</text>
    <path class="ar" d="M105,29 C105,56 15,56 15,31" marker-end="url(#a)" stroke="#27ae60" stroke-width="1.7"/>
    <text class="t"  x="168" y="14" fill="#27ae60" font-weight="700">loop 4 ticks per attempt</text>
    <text class="ti" x="168" y="28"><tspan font-family="SFMono-Regular, Menlo, Consolas, monospace" font-style="normal">racld</tspan> — resident</text>
    
  </g>
  
  
</g>

<line class="sep" x1="30" y1="262" x2="990" y2="262"/>

<!-- ============ (c) ============ -->
<text class="lbl" x="24" y="296">c</text>
<text class="h" x="46" y="296">Where the error draw sits</text>

<!-- roll-first -->
<g transform="translate(96,320)">
  <text class="h" x="0" y="0" fill="#c0392b">roll-first  (original)</text>
  <rect class="die"  x="0" y="14" width="98" height="30" rx="3"/><text class="t" x="49" y="33" text-anchor="middle">draw</text>
  <path class="ar" d="M49,44 L49,64" marker-end="url(#a)"/>
  <rect class="seek" x="0" y="64" width="98" height="30" rx="3"/><text class="t" x="49" y="83" text-anchor="middle">seek letter</text>
  <path class="ar" d="M98,79 L146,79" marker-end="url(#a)"/>
  <text class="ti" x="101" y="74">found</text>
  <rect class="box" x="146" y="64" width="76" height="30" rx="3"/><text class="t" x="184" y="83" text-anchor="middle">write</text>
  <path class="ar" d="M49,94 L49,122" marker-end="url(#a)"/>
  <text class="ti" x="55" y="112">not found</text>
  <rect class="box" x="0" y="122" width="98" height="30" rx="3" stroke="#c0392b"/><text class="t" x="49" y="141" text-anchor="middle" fill="#c0392b">stall</text>
  <path class="arr" d="M-12,137 C-42,137 -42,29 -6,29" marker-end="url(#ar)"/>
  <text class="ti" x="49" y="176" text-anchor="middle" fill="#c0392b" font-weight="700">a fresh draw on every attempt</text>
</g>

<!-- find-first -->
<g transform="translate(430,320)">
  <text class="h" x="0" y="0" fill="#c8912f">find-first</text>
  <rect class="seek" x="0" y="14" width="98" height="30" rx="3"/><text class="t" x="49" y="33" text-anchor="middle">seek letter</text>
  <path class="ar" d="M98,29 L146,29" marker-end="url(#a)"/>
  <text class="ti" x="101" y="24">not found</text>
  <rect class="box" x="146" y="14" width="76" height="30" rx="3"/><text class="t" x="184" y="33" text-anchor="middle">stall</text>
  <path class="ar" d="M224,18 C248,18 248,42 228,41" marker-end="url(#a)"/>
  <text class="ti" x="252" y="33">re-seek</text>
  <path class="ar" d="M49,44 L49,64" marker-end="url(#a)"/>
  <text class="ti" x="55" y="60">found</text>
  <rect class="die"  x="0" y="64" width="98" height="30" rx="3"/><text class="t" x="49" y="83" text-anchor="middle">draw</text>
  <path class="ar" d="M98,79 L146,79" marker-end="url(#a)"/>
  <rect class="box" x="146" y="64" width="76" height="30" rx="3"/><text class="t" x="184" y="83" text-anchor="middle">write</text>
  <text class="ti" x="49" y="176" text-anchor="middle" font-weight="700">one draw per letter — a stall draws nothing</text>
</g>

<!-- remember-roll -->
<g transform="translate(764,320)">
  <text class="h" x="0" y="0" fill="#8e44ad">remember-roll</text>
  <rect class="die"  x="0" y="14" width="98" height="30" rx="3"/><text class="t" x="49" y="33" text-anchor="middle">draw</text>
  <path class="ar" d="M49,44 L49,64" marker-end="url(#a)"/>
  <rect class="seek" x="0" y="64" width="98" height="30" rx="3"/><text class="t" x="49" y="83" text-anchor="middle">seek letter</text>
  <path class="ar" d="M98,79 L146,79" marker-end="url(#a)"/>
  <text class="ti" x="101" y="74">found</text>
  <rect class="box" x="146" y="64" width="76" height="30" rx="3"/><text class="t" x="184" y="83" text-anchor="middle">write</text>
  <path class="ar" d="M49,94 L49,122" marker-end="url(#a)"/>
  <text class="ti" x="55" y="112">not found</text>
  <rect class="box" x="0" y="122" width="98" height="30" rx="3" stroke="#8e44ad"/><text class="t" x="49" y="141" text-anchor="middle" fill="#8e44ad">stall</text>
  <path class="arg" d="M-12,137 C-42,137 -42,79 -6,79" marker-end="url(#ap)"/>
  <text class="ti" x="49" y="176" text-anchor="middle" fill="#8e44ad" font-weight="700">outcome kept — re-seek, do not draw again</text>
</g>


</svg>
